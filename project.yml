name: ClipRecall
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClipRecallCore:
    path: ClipRecallCore
targets:
  ClipRecall:
    type: application
    platform: macOS
    sources:
      - App/ClipRecall
    dependencies:
      - package: ClipRecallCore
    info:
      path: App/ClipRecall/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andromeda.ClipRecall
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: App/ClipRecall/ClipRecall.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ClipRecall:
    build:
      targets:
        ClipRecall: all
    run:
      config: Debug
